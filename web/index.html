<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one narrow column like a drawer list — summary, "use soon" strip, filters, then category shelves. */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --line:#e4dfe8; --fg:#2a2230; --muted:#756a7d;
  --accent:#8a2f5b; --accent-soft:#f3e3ec;
  --warn:#a35c00; --warn-soft:#fbefdc; --crit:#b3261e; --crit-soft:#fbe4e2;
  --coral:#ef7d62; --pink:#e46aa0; --goop:#a07a68;
  --display:"Jua",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18141b; --surface:#221d26; --line:#372f3d; --fg:#f0eaf3; --muted:#a99db1;
  --accent:#e89abd; --accent-soft:#3a2431; --warn:#f0b35a; --warn-soft:#3a2c16; --crit:#ff8a80; --crit-soft:#3d1f1d;
  --coral:#f59a83; --pink:#f08dbb; --goop:#c49e8b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18141b; --surface:#221d26; --line:#372f3d; --fg:#f0eaf3; --muted:#a99db1;
  --accent:#e89abd; --accent-soft:#3a2431; --warn:#f0b35a; --warn-soft:#3a2c16; --crit:#ff8a80; --crit-soft:#3d1f1d;
  --coral:#f59a83; --pink:#f08dbb; --goop:#c49e8b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1.15;margin:0;color:var(--accent);text-wrap:balance}
h2{font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.summary{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted)}
.summary b{color:var(--fg);font-weight:600}
.soon{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.soon ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.soon li{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.soon li span:first-child{min-width:0}
.controls{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shelf{display:flex;flex-direction:column;gap:6px}
.shelf h3{margin:0;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.shelf h3 small,.parent small{color:var(--muted);font-weight:400}
.parent{margin:0 0 -10px;font-size:1.05rem;display:flex;gap:8px;align-items:baseline}
.shelf.child{padding-left:12px;border-left:2px solid var(--line)}
.shelf.child h3{font-size:.92rem}
.group{font-size:.72rem;color:var(--accent);font-weight:600;letter-spacing:.04em}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
summary::-webkit-details-marker{display:none}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.name{min-width:0;font-weight:500}
.count{flex:none;font-weight:600;color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);align-items:center}
.dot{display:inline-flex;align-items:center;gap:4px}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.pill{flex:none;white-space:nowrap;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.units{border-top:1px solid var(--line);margin:0;padding:8px 12px 10px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.units li{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.units li b{color:var(--fg);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:24px 0}
footer{color:var(--muted);font-size:.8rem}
.zone{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.2;margin:4px 0 -8px;color:var(--accent)}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>화장대</h1>
    <div class="summary num" id="summary"></div>
  </header>
  <section class="soon" aria-labelledby="soon-h">
    <h2 id="soon-h">곧 써야 할 제품 · 6개월 이내</h2>
    <ul id="soon"></ul>
  </section>
  <div class="controls">
    <input type="search" id="q" placeholder="제품명·종류·상태로 찾기 (예: 토너, 미개봉, 헤라)" aria-label="제품명, 종류, 상태 검색">
    <div class="row" id="groups" role="group" aria-label="대분류"></div>
    <div class="row" id="filters" role="group" aria-label="상태와 톤"></div>
  </div>
  <main id="list" style="display:flex;flex-direction:column;gap:22px"></main>
  <footer id="foot"></footer>
</div>

  const st = [...state.f].filter(x => STATUS[x]); const tn = [...state.f].filter(x => !STATUS[x] && x!=="sample");
  const qUsed = state.q && ["다 씀","리뷰"].some(w => w.includes(state.q) || state.q.includes(w));
  if (i.status==="used-up" && !st.includes("used-up") && !qUsed) return false;
  if (st.length && !st.includes(i.status)) return false;
  if (tn.length && !(i.tone||[]).some(t => tn.includes(t))) return false;
  return true;
}

function renderList(){
  const el = document.getElementById("list"); const shown = items.filter(match);
  if (!shown.length){ el.innerHTML = `<p class="empty">조건에 맞는 제품이 없어요. 필터를 풀어보세요.</p>`; return; }
  let html = "", lastG = null, lastP = null;
  const rank = u => ({"in-use":0,"unopened":1,"used-up":3})[u.status] ?? 2;
  const due = u => u.useBy || u.expiresAt || "9999-12-31";
  const cmp = (a,b) => rank(a)-rank(b) || (a.sample?1:0)-(b.sample?1:0) || due(a).localeCompare(due(b));
  const allSample = u => u.every(x => x.sample) ? 1 : 0;
  for (const g of Object.keys(CATS)) for (const s of Object.keys(CATS[g].subcategories)){
    const list = shown.filter(i => i.g===g && i.s===s); if (!list.length) continue;
    const byName = new Map(); list.forEach(i => { if(!byName.has(i.name)) byName.set(i.name, []); byName.get(i.name).push(i); });
    const sorted = [...byName].map(([n,u]) => [n, u.sort(cmp)]).sort((a,b) => allSample(a[1])-allSample(b[1]) || cmp(a[1][0], b[1][0]));
    if (g!==lastG && groupNames[g]!==CATS[g].subcategories[s]) html += `<h2 class="zone">${esc(groupNames[g])}</h2>`;
    lastG = g;
    const parent = CATS[g].parents?.[s] || null;
    if (parent && parent!==lastP){
      const pn = shown.filter(i => i.g===g && CATS[g].parents?.[i.s]===parent).length;
      html += `<h3 class="parent">${esc(parent)} <small class="num">${pn}개</small></h3>`;
    }
    lastP = parent;
    html += `<section class="shelf${parent?" child":""}"><h3>${esc(CATS[g].subcategories[s])} <small class="num">${list.length}개</small></h3>`;
    for (const [name, units] of sorted){
      const cnt = {}; units.forEach(u => { const k = STATUS[u.status]||"상태 모름"; cnt[k]=(cnt[k]||0)+1; });
      const ns = units.filter(u => u.sample).length;
      const tones = [...new Set(units.flatMap(u => u.tone||[]))];
      const nearest = units.filter(u=>u.status!=="used-up").map(u=>u.useBy).filter(Boolean).sort()[0];
      html += `<details><summary>
        <div class="top"><span class="name">${esc(name)}${ns===units.length?` <span class="pill">샘플</span>`:""}</span>${units.length>1?`<span class="count num">×${units.length}</span>`:""}</div>
        <div class="meta">${Object.entries(cnt).map(([k,v])=>`<span>${k}${units.length>1?" "+v:""}</span>`).join(" · ")}${ns&&ns<units.length?` · <span>샘플 ${ns}</span>`:""}
          ${tones.map(t=>`<span class="dot" style="--c:${TONE_COLOR[t]||"var(--muted)"}">${esc(t)}</span>`).join("")}
          ${duePill(nearest)}</div></summary>
        <ul class="units">${units.map(u => `<li><b>${STATUS[u.status]||"상태 모름"}${u.sample?" · 샘플":""}</b>${
          [u.status==="used-up"&&u.usedUpAt&&`다 쓴 날 ${u.usedUpAt}`, u.expiresAt&&`유통기한 ${u.expiresAt}`,
           u.status==="in-use"&&u.useBy&&`사용 기한 ${u.useBy}`, won(u.price), u.store, u.memo].filter(Boolean).map(x=>`<span class="num">${esc(x)}</span>`).join("")
          || "<span>추가 정보 없음</span>"}</li>`).join("")}</ul></details>`;
    }
    html += `</section>`;
  }
  el.innerHTML = html;
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
document.getElementById("foot").textContent = `데이터 기준일 ${UPDATED} · 추가·수정은 Claude에게 말하면 반영돼요.`;
renderSummary(); renderControls(); renderList();
</script>
