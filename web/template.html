<title>내 화장대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a Hollywood vanity — bulb-framed mirror (title, counts, "use soon" notes), countertop filters, lacquered shelves of little product objects, drawers for tools. */
:root{
  --wall:#efe5ea; --lacquer:#f8f2f4; --frame:#ead8de; --shelf:#e6d0d7; --shelf-edge:#cfb3bc;
  --ink:#2e2329; --muted:#7c6a73; --brass:#a9844d; --note:#fff7e6; --note-ink:#4a3a2c;
  --glass-a:#fbfdfe; --glass-b:#e3ebef; --bulb:#fff6dc; --glow:rgba(255,214,140,.55);
  --obj-line:rgba(46,35,41,.18); --crit:#c2362b; --warn:#c07a10;
  --coral:#f08a6c; --pink:#ea8db1; --goop:#b5836f;
  --display:"Hahmlet",ui-serif,"Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#191317; --lacquer:#241b20; --frame:#33262d; --shelf:#3b2c34; --shelf-edge:#2a1f25;
  --ink:#f4eaef; --muted:#b09fa8; --brass:#d8b077; --note:#3a3226; --note-ink:#f1e4cf;
  --glass-a:#2d353b; --glass-b:#1b2126; --bulb:#ffeec2; --glow:rgba(255,200,110,.75);
  --obj-line:rgba(255,255,255,.22); --crit:#ff8a7e; --warn:#f2b552; color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#191317; --lacquer:#241b20; --frame:#33262d; --shelf:#3b2c34; --shelf-edge:#2a1f25;
  --ink:#f4eaef; --muted:#b09fa8; --brass:#d8b077; --note:#3a3226; --note-ink:#f1e4cf;
  --glass-a:#2d353b; --glass-b:#1b2126; --bulb:#ffeec2; --glow:rgba(255,200,110,.75);
  --obj-line:rgba(255,255,255,.22); --crit:#ff8a7e; --warn:#f2b552; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.vanity{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* mirror */
.mirror{position:relative;background:var(--frame);border-radius:22px 22px 10px 10px;padding:30px 30px 26px}
.bulbs{position:absolute;display:flex;justify-content:space-between;pointer-events:none}
.bulbs.top{left:26px;right:26px;top:8px}
.bulbs.left,.bulbs.right{top:40px;bottom:26px;flex-direction:column;width:14px}
.bulbs.left{left:8px}.bulbs.right{right:8px}
.bulb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--bulb) 60%);
  box-shadow:0 0 10px 2px var(--glow);animation:on .5s ease-out both;animation-delay:calc(var(--i)*45ms)}
@keyframes on{from{opacity:.15;box-shadow:none}to{opacity:1}}
.glass{position:relative;border-radius:14px 14px 6px 6px;padding:26px 22px 22px;overflow:hidden;
  background:linear-gradient(160deg,var(--glass-a),var(--glass-b));box-shadow:inset 0 0 0 1px var(--obj-line);
  display:flex;flex-direction:column;gap:18px}
.glass::before{content:"";position:absolute;inset:-40% auto auto -30%;width:60%;height:180%;transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);pointer-events:none}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.9rem}
.counts b{color:var(--ink);font-weight:600}
.notes{display:flex;flex-wrap:wrap;gap:10px}
.note{background:var(--note);color:var(--note-ink);padding:9px 11px 10px;border-radius:2px;font-size:.8rem;line-height:1.35;
  width:150px;box-shadow:0 2px 6px rgba(0,0,0,.12);transform:rotate(var(--r));cursor:pointer;text-align:left;border:0}
.note b{display:block;font-weight:600;margin-bottom:3px}
.note .when{color:var(--crit);font-weight:600}
.note .when.warn{color:var(--warn)}
.note.calm{cursor:default}

/* countertop */
.counter{background:var(--lacquer);border-radius:0 0 14px 14px;padding:16px 18px 18px;box-shadow:0 10px 24px -14px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:10px}
input[type=search]{width:100%;font:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--obj-line);background:var(--wall);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;padding:4px 12px;border-radius:999px;border:1px solid var(--obj-line);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--lacquer);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* shelves */
.cabinet{margin-top:22px;background:var(--lacquer);border-radius:14px;padding:6px 0 10px;box-shadow:0 10px 24px -14px rgba(0,0,0,.35)}
.zone{padding:14px 18px 2px;font-family:var(--display);font-size:1.05rem;font-weight:700;display:flex;gap:8px;align-items:baseline}
.zone small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.shelf{padding:12px 0 0}
.plate{margin:0 18px 6px;display:inline-flex;gap:6px;align-items:baseline;font-size:.78rem;letter-spacing:.04em;color:var(--brass);font-weight:600;
  border:1px solid var(--brass);border-radius:3px;padding:1px 8px}
.row{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:4px 18px 0;scrollbar-width:thin}
.plank{height:12px;margin:0 10px;background:var(--shelf);border-radius:2px;box-shadow:0 4px 0 var(--shelf-edge),0 10px 14px -8px rgba(0,0,0,.35)}
.item{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.item .lbl{order:2;font-size:.7rem;line-height:1.3;color:var(--muted);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.6em}
.obj{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:104px;transition:transform .15s}
.item:hover .obj,.item:focus-visible .obj{transform:translateY(-4px)}
.obj span{display:block;box-shadow:inset 0 0 0 1px var(--obj-line)}
.badge{position:absolute;top:-2px;right:-14px;background:var(--ink);color:var(--lacquer);font-size:.68rem;font-weight:600;border-radius:999px;padding:0 6px;box-shadow:none!important}
.alert{position:absolute;top:2px;left:-10px;width:9px;height:9px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--lacquer)!important}
.alert.warn{background:var(--warn)}
.shine{background-image:linear-gradient(100deg,rgba(255,255,255,.55) 0 18%,transparent 30%)}
/* shapes */
.bottle .cap{width:18px;height:20px;border-radius:4px 4px 2px 2px;background:var(--metal)}
.bottle .body{width:40px;height:70px;border-radius:9px 9px 6px 6px;background:var(--c)}
.jar .cap{width:58px;height:16px;border-radius:5px;background:var(--metal)}
.jar .body{width:54px;height:36px;border-radius:4px 4px 10px 10px;background:var(--c)}
.tube .body{width:34px;height:76px;background:var(--c);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);border-radius:3px}
.tube .cap{width:22px;height:16px;border-radius:2px 2px 5px 5px;background:var(--metal)}
.compact .body{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,var(--c) 0 52%,var(--metal) 54%)}
.pencil .tip{width:12px;height:16px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none!important}
.pencil .body{width:12px;height:80px;border-radius:0 0 3px 3px;background:var(--metal)}
.lipstick .tip{width:18px;height:26px;background:var(--c);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%);border-radius:2px;box-shadow:none!important}
.lipstick .collar{width:22px;height:10px;background:var(--brass)}
.lipstick .body{width:26px;height:46px;border-radius:3px;background:var(--metal)}
.wand .cap{width:16px;height:44px;border-radius:5px 5px 2px 2px;background:var(--metal)}
.wand .body{width:22px;height:44px;border-radius:2px 2px 6px 6px;background:var(--c)}
.small .body{width:44px;height:30px;border-radius:12px;background:var(--c)}
.empty{color:var(--muted);text-align:center;padding:30px 16px}

/* drawers */
.drawers{display:flex;flex-direction:column;gap:8px;padding:14px 10px 4px}
.drawer{background:var(--frame);border-radius:6px;box-shadow:inset 0 0 0 1px var(--obj-line)}
.drawer>button{width:100%;background:none;border:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600}
.knob{width:34px;height:8px;border-radius:999px;background:var(--brass)}
.drawer ul{list-style:none;margin:0;padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.drawer li button{background:none;border:0;padding:0;cursor:pointer;text-align:left}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,16,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--lacquer);border-radius:18px 18px 0 0;max-height:80%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30%);opacity:.4}}
.sheet-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-size:1.3rem;margin:0;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.units{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.units li{border-top:1px solid var(--obj-line);padding-top:8px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.88rem}
.units dt{color:var(--muted)} .units dd{margin:0}
.close{align-self:flex-end;background:none;border:1px solid var(--obj-line);border-radius:999px;padding:4px 14px;cursor:pointer}
footer{color:var(--muted);font-size:.78rem;text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){.bulb,.sheet{animation:none}.obj{transition:none}}
</style>

<div class="vanity">
  <section class="mirror" aria-label="거울">
    <div class="bulbs top" id="bt"></div><div class="bulbs left" id="bl"></div><div class="bulbs right" id="br"></div>
    <div class="glass">
      <h1>내 화장대</h1>
      <div class="counts num" id="counts"></div>
      <div class="notes" id="notes" aria-label="곧 써야 할 제품"></div>
    </div>
  </section>
  <div class="counter">
    <input type="search" id="q" placeholder="찾을 제품 (예: 틴트, 헤라)" aria-label="제품명 검색">
    <div class="chips" id="groups" role="group" aria-label="대분류"></div>
    <div class="chips" id="filters" role="group" aria-label="상태와 톤"></div>
  </div>
  <div class="cabinet" id="cabinet"></div>
  <footer id="foot"></footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" hidden></div>

<script>
const DATA = __DATA__;
const CATS = __CATS__;
const UPDATED = "__UPDATED__";
const STATUS = {"in-use":"사용중","unopened":"미개봉"};
const TONES = {"코랄":"var(--coral)","핑크":"var(--pink)","굽굽":"var(--goop)"};
const SHAPE = {toner:"bottle",essence:"bottle",serum:"bottle",lotion:"bottle",mist:"bottle","facial-oil":"bottle",
  "cleansing-oil":"bottle","cleansing-water":"bottle",primer:"bottle",prep:"bottle",foundation:"bottle","setting-spray":"bottle","tone-up":"tube",
  cream:"jar","eye-cream":"jar","wash-off-mask":"jar",sunscreen:"tube","lip-care":"tube","cleansing-foam":"tube",exfoliator:"tube","toner-pad":"jar",
  cushion:"compact",powder:"compact",blusher:"compact",highlighter:"compact",eyeshadow:"compact",contour:"pencil",
  eyebrow:"pencil",eyeliner:"pencil","lip-liner":"pencil","base-lip":"lipstick",lipstick:"lipstick",
  "lip-tint":"wand","lip-gloss":"wand",mascara:"wand",concealer:"wand"};
const PARTS = {bottle:["cap","body"],jar:["cap","body"],tube:["body","cap"],compact:["body"],pencil:["tip","body"],
  lipstick:["tip","collar","body"],wand:["cap","body"],small:["body"]};
const SOFT = ["#e8eef0","#dfeae4","#f2e4ea","#e6e1f0","#f3ede2","#e2e9f3"];
const PIGMENT = ["#d98d84","#c97a8c","#e0a48a","#b98a7a","#d7a0b3","#a7787f","#e6b39a","#c4908f"];
const METAL = ["#2f2a2e","#d9d4d7","#c9a978","#f4f1f2","#5b4b52"];
const hash = s => [...s].reduce((h,c) => (h*31 + c.charCodeAt(0))>>>0, 7);
const today = new Date(); today.setHours(0,0,0,0);
const daysLeft = d => d ? Math.round((new Date(d+"T00:00:00") - today)/86400000) : null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const level = d => { const n = daysLeft(d); return n==null ? "" : n<=90 ? "crit" : n<=183 ? "warn" : ""; };

const items = [];
for (const [g, subs] of Object.entries(DATA))
  for (const [s, list] of Object.entries(subs)) for (const it of list) items.push({...it, g, s});
const products = new Map();   // key g|s|name -> units
items.forEach(i => { const k = `${i.g}|${i.s}|${i.name}`; if(!products.has(k)) products.set(k, []); products.get(k).push(i); });
const groupName = g => CATS[g]?.name || g;

// bulbs
[["bt",9],["bl",5],["br",5]].forEach(([id,n],j) => document.getElementById(id).innerHTML =
  Array.from({length:n},(_,i)=>`<span class="bulb" style="--i:${j*3+i}"></span>`).join(""));

function renderMirror(){
  const by = {}; items.forEach(i => by[i.g]=(by[i.g]||0)+1);
  document.getElementById("counts").innerHTML = `<span>총 <b>${items.length}</b>개</span>` +
    Object.keys(CATS).filter(g=>by[g]).map(g=>`<span>${groupName(g)} <b>${by[g]}</b></span>`).join("");
  const soon = items.filter(i => i.useBy && daysLeft(i.useBy) <= 183).sort((a,b)=>a.useBy.localeCompare(b.useBy));
  const el = document.getElementById("notes");
  if (!soon.length){ el.innerHTML = `<div class="note calm" style="--r:-1.5deg"><b>6개월 안에 끝나는 제품 없음</b>기한이 가까워지면 여기에 붙어요.</div>`; return; }
  el.innerHTML = soon.slice(0,6).map((i,n) => { const d = daysLeft(i.useBy);
    return `<button class="note" style="--r:${[-2,1.5,-1,2,-1.5,1][n%6]}deg" data-k="${esc(i.g+"|"+i.s+"|"+i.name)}">
      <b>${esc(i.name)}</b><span class="when ${level(i.useBy)} num">${d<0?"기한 지남":`D-${d}`} · ${i.useBy}</span></button>`; }).join("");
}

const state = {q:"", g:"all", f:new Set()};
function chip(label, on, fn, color){
  const b = document.createElement("button"); b.type="button"; b.className="chip"; b.setAttribute("aria-pressed", on);
  b.innerHTML = (color?`<i style="--c:${color}"></i>`:"") + esc(label); b.onclick = fn; return b;
}
function renderControls(){
  const g = document.getElementById("groups"); g.innerHTML = "";
  [["all","전체"],...Object.keys(CATS).map(k=>[k,groupName(k)])].forEach(([k,l]) =>
    g.append(chip(l, state.g===k, ()=>{state.g=k; renderControls(); renderCabinet();})));
  const f = document.getElementById("filters"); f.innerHTML = "";
  [["in-use","사용중"],["unopened","미개봉"],...Object.entries(TONES).map(([t,c])=>[t,t,c])].forEach(([k,l,c]) =>
    f.append(chip(l, state.f.has(k), ()=>{state.f.has(k)?state.f.delete(k):state.f.add(k); renderControls(); renderCabinet();}, c)));
}
function match(i){
  if (state.g!=="all" && i.g!==state.g) return false;
  if (state.q && !i.name.toLowerCase().includes(state.q.toLowerCase())) return false;
  const st=[...state.f].filter(x=>STATUS[x]), tn=[...state.f].filter(x=>!STATUS[x]);
  if (st.length && !st.includes(i.status)) return false;
  if (tn.length && !(i.tone||[]).some(t=>tn.includes(t))) return false;
  return true;
}

function objHTML(key, units){
  const u = units[0], shape = SHAPE[u.s] || "small", h = hash(u.name);
  const tones = [...new Set(units.flatMap(x=>x.tone||[]))];
  let c = u.g==="skincare" ? SOFT[h%SOFT.length] : PIGMENT[h%PIGMENT.length];
  if (tones.length===1) c = TONES[tones[0]] || c;
  if (tones.length>1) c = `linear-gradient(90deg,${tones.map(t=>TONES[t]).join(",")})`;
  const metal = METAL[(h>>3)%METAL.length];
  const near = units.map(x=>x.useBy).filter(Boolean).sort()[0]; const lv = level(near);
  const parts = PARTS[shape].map(p => `<span class="${p} ${p==="body"?"shine":""}"></span>`).join("");
  return `<button class="item" data-k="${esc(key)}" aria-label="${esc(u.name)}${units.length>1?`, ${units.length}개`:""}">
    <span class="obj ${shape}" style="--c:${c};--metal:${metal}">${lv?`<span class="alert ${lv}"></span>`:""}${parts}${units.length>1?`<span class="badge num">${units.length}</span>`:""}</span>
    <span class="lbl">${esc(u.name)}</span></button>`;
}

function renderCabinet(){
  const el = document.getElementById("cabinet"); let html = "", any = false;
  for (const g of Object.keys(CATS)){
    const isDrawer = g==="tools" || g==="etc";
    const subs = Object.keys(CATS[g].subcategories).map(s => {
      const list = [...products].filter(([k,u]) => u[0].g===g && u[0].s===s).map(([k,u]) => [k, u.filter(match)]).filter(([k,u])=>u.length);
      return [s, list];
    }).filter(([s,l])=>l.length);
    if (!subs.length) continue; any = true;
    const total = subs.reduce((n,[s,l])=>n+l.reduce((m,[k,u])=>m+u.length,0),0);
    if (isDrawer){
      html += `<div class="drawers">` + subs.map(([s,l]) => `<div class="drawer"><button type="button" aria-expanded="false" data-drawer>
        <span>${esc(groupName(g))} · ${esc(CATS[g].subcategories[s])} <small class="num">${l.reduce((m,[k,u])=>m+u.length,0)}개</small></span><span class="knob"></span></button>
        <ul hidden>${l.map(([k,u])=>`<li><button type="button" data-k="${esc(k)}">${esc(u[0].name)}${u.length>1?` <b class="num">×${u.length}</b>`:""}</button></li>`).join("")}</ul></div>`).join("") + `</div>`;
      continue;
    }
    html += `<div class="zone">${esc(groupName(g))} 선반 <small class="num">${total}개</small></div>`;
    for (const [s,l] of subs){
      const n = l.reduce((m,[k,u])=>m+u.length,0);
      html += `<div class="shelf"><span class="plate">${esc(CATS[g].subcategories[s])} <span class="num">${n}</span></span>
        <div class="row">${l.map(([k,u])=>objHTML(k,u)).join("")}</div><div class="plank"></div></div>`;
    }
  }
  el.innerHTML = any ? html : `<p class="empty">조건에 맞는 제품이 없어요. 필터를 풀어보세요.</p>`;
}

const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function openSheet(key){
  const units = products.get(key); if (!units) return; const u = units[0];
  const tones = [...new Set(units.flatMap(x=>x.tone||[]))];
  const row = (k,v) => v==null||v==="" ? "" : `<dt>${k}</dt><dd class="num">${esc(v)}</dd>`;
  sheet.innerHTML = `<div class="sheet-in"><button class="close" type="button" id="close">닫기</button>
    <h2 id="sheet-h">${esc(u.name)}</h2>
    <div class="sub"><span>${esc(groupName(u.g))} › ${esc(CATS[u.g].subcategories[u.s])}</span><span class="num">${units.length}개</span>
      ${tones.map(t=>`<span class="chip" style="cursor:default"><i style="--c:${TONES[t]}"></i>${esc(t)}</span>`).join("")}</div>
    <ul class="units">${units.map(x=>`<li><dl style="display:contents">${row("상태",STATUS[x.status]||"모름")}${row("개봉일",x.openedAt)}
      ${row("개봉 후",x.paoMonths&&x.paoMonths+"개월")}${row("유통기한",x.expiresAt)}${row("사용 기한",x.useBy)}
      ${row("가격",x.price!=null&&x.price.toLocaleString("ko-KR")+"원")}${row("구매처",x.store)}${row("메모",x.memo)}</dl></li>`).join("")}</ul></div>`;
  sheet.hidden = scrim.hidden = false; document.getElementById("close").focus();
}
function closeSheet(){ sheet.hidden = scrim.hidden = true; }
document.addEventListener("click", e => {
  const d = e.target.closest("[data-drawer]");
  if (d){ const ul = d.nextElementSibling; ul.hidden = !ul.hidden; d.setAttribute("aria-expanded", !ul.hidden); return; }
  const k = e.target.closest("[data-k]"); if (k) openSheet(k.dataset.k);
  if (e.target.id==="close" || e.target===scrim) closeSheet();
});
document.addEventListener("keydown", e => { if (e.key==="Escape") closeSheet(); });
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderCabinet(); });
document.getElementById("foot").textContent = `${UPDATED} 기준 · 추가·수정은 Claude에게 말하면 반영돼요`;
renderMirror(); renderControls(); renderCabinet();
</script>
